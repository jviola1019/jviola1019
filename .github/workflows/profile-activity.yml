name: Refresh selected public portfolio activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"
  push:
    paths:
      - "data/projects.json"
      - "scripts/render_activity.py"
      - ".github/workflows/profile-activity.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jviola1019/jviola1019'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render from selected public default-branch commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_activity.py
      - name: Check assets and activity consistency
        run: |
          python3 scripts/check_profile.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Commit source-driven changes only
        run: |
          git add assets/activity-dark.svg assets/activity-light.svg assets/activity-mobile-dark.svg assets/activity-mobile-light.svg
          if git diff --cached --quiet; then
            echo "No source project changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh selected public project activity"
          git push
