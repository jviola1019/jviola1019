l="#B5C1C7">Holdout &amp; sensitivity</text></rect><rect x="970" y="72" width="218" height="136" fill="#1D2D34" rx="4" stroke="#3D5158"/><text x="985" y="101" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" fill="#E7B477">05</text><text x="985" y="141" font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F1F4F2">REPORT</text><path d="M985 153H1174" stroke="#3D5158"/><text x="985" y="182" font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif" font-size="15" fill="#B5C1C7">Failures &amp; uncertainty</text></rect></svg>
