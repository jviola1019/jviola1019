<text x="49" y="287" font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif" font-size="31" font-weight="500" fill="#182831">Analytics, simulation &amp; useful software.</text>
<text x="49" y="330" font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif" font-size="22" fill="#4B626E">I build decision tools. Then I test the assumptions.</text>
